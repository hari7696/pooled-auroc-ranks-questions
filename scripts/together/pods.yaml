apiVersion: v1
kind: Pod
metadata:
  name: wq-w0
  labels: {app: wq}
spec:
  restartPolicy: Never
  containers:
  - name: main
    image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
    command: ["/bin/bash", "/cfg/worker.sh"]
    env: [{name: POD, value: "w0"}]
    resources:
      limits: {nvidia.com/gpu: 1}
      requests: {cpu: "8", memory: "32Gi"}
    volumeMounts:
    - {name: shared, mountPath: /mnt/shared}
    - {name: cfg, mountPath: /cfg}
    - {name: dshm, mountPath: /dev/shm}
  volumes:
  - name: shared
    persistentVolumeClaim: {claimName: shared-pvc}
  - name: cfg
    configMap: {name: wq-code}
  - name: dshm
    emptyDir: {medium: Memory, sizeLimit: 16Gi}
---
